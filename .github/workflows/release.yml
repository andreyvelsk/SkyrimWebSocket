name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Same build pipeline as the main branch (see _build.yml) — no more drift.
  build:
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compiled DLL
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SkyrimWebSocket ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/SkyrimWebSocket.dll
          fail_on_unmatched_files: true
