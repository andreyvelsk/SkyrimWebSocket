name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  VCPKG_COMMIT: "77df67cfff9c12ccfdb52284e07c87c75092f723"
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
  VCPKG_FEATURE_FLAGS: "manifests,binarycaching"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-x64-windows-static-

      - name: Prepare vcpkg binary cache
        run: cmake -E make_directory "${{ env.VCPKG_BINARY_CACHE }}"

      - name: Configure CMake (Release)
        run: cmake --preset release

      - name: Build (Release)
        run: cmake --build build/release --config Release

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimWebSocket-${{ github.sha }}
          path: build/release/SkyrimWebSocket.dll
          if-no-files-found: error
