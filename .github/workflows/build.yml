name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  VCPKG_COMMIT: "77df67cfff9c12ccfdb52284e07c87c75092f723"
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
  VCPKG_FEATURE_FLAGS: "manifests,binarycaching"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Compute vcpkg cache key
        id: vcpkg-cache
        shell: pwsh
        run: |
          $parts = @(
            "vs$env:VSCMD_VER",
            "msvc$env:VCToolsVersion",
            "sdk$env:WindowsSDKVersion",
            "ucrt$env:UCRTVersion",
            "image$env:ImageVersion"
          ) | ForEach-Object { $_ -replace '[^A-Za-z0-9_.-]', '-' }
          "toolchain=$($parts -join '-')" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT }}-${{ steps.vcpkg-cache.outputs.toolchain }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT }}-${{ steps.vcpkg-cache.outputs.toolchain }}-

      - name: Prepare vcpkg binary cache
        run: cmake -E make_directory "${{ env.VCPKG_BINARY_CACHE }}"

      - name: Install ccache
        shell: pwsh
        run: |
          $url = "https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip"
          $zip = "${{ runner.temp }}\ccache.zip"
          curl -L -o $zip $url
          7z x $zip -o"${{ runner.temp }}\ccache" -y
          echo "${{ runner.temp }}\ccache" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache ccache artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ steps.vcpkg-cache.outputs.toolchain }}-${{ hashFiles('lib/commonlibsse-ng/src/**/*.cpp', 'lib/commonlibsse-ng/src/**/*.h', 'lib/commonlibsse-ng/CMakeLists.txt', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.vcpkg-cache.outputs.toolchain }}-

      - name: Configure CMake (Release)
        run: cmake --preset release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (Release)
        run: cmake --build build/release --config Release

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimWebSocket-${{ github.sha }}
          path: build/release/SkyrimWebSocket.dll
          if-no-files-found: error
